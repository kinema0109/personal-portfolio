<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Hoàng Công Thọ — Full-Stack Engineer</title>
    <meta
      name="description"
      content="Full-Stack Engineer, four years in the JavaScript and TypeScript ecosystem: React and Next.js interfaces, NestJS APIs, SQL and NoSQL. CV and projects inside."
    />
    <meta name="author" content="Hoàng Công Thọ" />
    <link rel="canonical" href="https://thohoang.vercel.app/" />
    <meta name="theme-color" content="#161a2b" />

    <!-- A saved day/night choice goes on <html> before anything paints. The sun maths run in
         src/daylight/phase.ts once the bundle loads. -->
    <script>
      try {
        var savedPhase = localStorage.getItem('tho-vn:phase')
        if (savedPhase === 'day' || savedPhase === 'night') document.documentElement.dataset.phase = savedPhase
      } catch (e) {}
    </script>

    <!-- Link previews (Facebook, LinkedIn, Zalo, Discord, Slack). Scrapers do not run JavaScript,
         so these stay static here; LocaleProvider only updates the title and description in the tab.
         og-cover.png is regenerated by scripts/export-og-image.mjs. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Hoàng Công Thọ" />
    <meta property="og:url" content="https://thohoang.vercel.app/" />
    <meta property="og:title" content="Hoàng Công Thọ — Full-Stack Engineer" />
    <meta
      property="og:description"
      content="Four years in the JavaScript and TypeScript ecosystem: React and Next.js interfaces, NestJS APIs, SQL and NoSQL. CV, projects and contact in one place."
    />
    <meta property="og:image" content="https://thohoang.vercel.app/og-cover.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Pixel-art room: a developer at a desk with a PC, a bookshelf and framed swords." />
    <meta property="og:locale" content="en_US" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Hoàng Công Thọ — Full-Stack Engineer" />
    <meta
      name="twitter:description"
      content="Four years in the JavaScript and TypeScript ecosystem: React and Next.js interfaces, NestJS APIs, SQL and NoSQL. CV, projects and contact in one place."
    />
    <meta name="twitter:image" content="https://thohoang.vercel.app/og-cover.png" />

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'%3E%3Crect width='8' height='8' fill='%23161a2b'/%3E%3Crect x='1' y='2' width='6' height='4' fill='%238ea3c4'/%3E%3Crect x='2' y='3' width='3' height='1' fill='%23eadfc3'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
